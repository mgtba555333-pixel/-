name: PulmoSight quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static and interface checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight preprocessing test dependencies
        run: python -m pip install --disable-pip-version-check "numpy<2" "Pillow>=10.2,<12" "scikit-learn>=1.4,<1.6" "fastapi>=0.110,<1.0" "python-multipart>=0.0.9" "httpx>=0.27,<1.0"

      - name: Compile Python modules
        run: python -m py_compile app/main.py app/model_service.py app/__init__.py scripts/quality_check.py scripts/evaluate_model.py tests/test_preprocessing.py tests/test_evaluation_metrics.py tests/test_api_safety.py

      - name: Run preprocessing unit tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Check site structure and safety guardrails
        run: python scripts/quality_check.py
